<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Институциональная подсистема РФ — схема</title>
<style>
:root{color-scheme:light;--ink:#1d1b26;--muted:#5d5a6b;--line:#d9d6e3;--paper:#f7f6f2;--card:#ffffff;--accent:#3F2A73;--accent2:#5E35B1;
 font-family:"PT Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{display:flex;flex-direction:column;height:100%;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
h1{font-size:17px;line-height:1.2;margin:0;font-weight:700;letter-spacing:.01em;white-space:nowrap}
h1 small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;border:1px solid transparent;background:none;color:var(--muted);padding:7px 12px 7px 8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#ece9f4;color:var(--accent);font-weight:700;font-size:12px}
.tab:hover{background:#f1eff7;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.tab[aria-selected="true"] .num{background:#fff;color:var(--accent)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.tools button{font:inherit;font-size:14px;height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;color:var(--ink)}
.tools button:hover{border-color:var(--accent2)}
#zoomv{min-width:58px;font-variant-numeric:tabular-nums}
#legbtn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
#legbtn[aria-expanded="true"]{background:#fff;color:var(--accent)}
main{position:relative;flex:1;overflow:hidden}
.page{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.page.drag{cursor:grabbing}
.page[hidden]{display:none}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage svg{display:block;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
a.lnk{cursor:pointer}
a.lnk:hover > g > rect, a.lnk:hover > g > path{stroke-width:3px;filter:brightness(.94)}
.hint{position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--muted);pointer-events:none;max-width:calc(100% - 32px)}
#url{position:absolute;right:16px;bottom:14px;background:var(--ink);color:#fff;border-radius:6px;padding:5px 9px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#legend{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(1600px,calc(100% - 32px));max-height:calc(100% - 32px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(20,10,50,.25);display:flex;flex-direction:column}
#legend[hidden]{display:none}
#legend .lh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
#legend .lh b{font-size:15px}
#legend .lh button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;height:30px;padding:0 10px;cursor:pointer}
#legend .lb{overflow:auto;padding:10px}
.legsvg svg{width:100%;min-width:2600px;height:auto;display:block}
.legsvg[hidden]{display:none}
@media (max-width:760px){h1 small{display:none} .tab{font-size:13px;padding:6px 8px} .tools{margin-left:0} .hint{display:none}}
</style></head><body>

const zv=document.getElementById('zoomv'), url=document.getElementById('url');
function size(i){const s=pages[i].querySelector('svg');return [parseFloat(s.getAttribute('width')),parseFloat(s.getAttribute('height'))];}
function apply(i){const v=st[i];pages[i].querySelector('.stage').style.transform=`translate(${v.x}px,${v.y}px) scale(${v.k})`; if(i===cur) zv.textContent=Math.round(v.k*100)+'%';}
function fit(i){const r=pages[i].getBoundingClientRect(),[w,h]=size(i);const k=Math.min((r.width-40)/w,(r.height-40)/h);st[i]={k,x:(r.width-w*k)/2,y:Math.max(20,(r.height-h*k)/2)};apply(i);}
function zoom(f,cx,cy){const v=st[cur],r=pages[cur].getBoundingClientRect();if(cx==null){cx=r.width/2;cy=r.height/2;}const nk=Math.min(4,Math.max(0.08,v.k*f));v.x=cx-(cx-v.x)*nk/v.k;v.y=cy-(cy-v.y)*nk/v.k;v.k=nk;apply(cur);}
function show(i){cur=i;pages.forEach((p,j)=>p.hidden=j!==i);tabs.forEach((t,j)=>t.setAttribute('aria-selected',j===i));legs.forEach((l,j)=>l.hidden=j!==i);
 document.getElementById('legtitle').textContent='Легенда — '+names[i];if(!st[i]) fit(i); else apply(i); history.replaceState(null,'','#'+(i+1));}
tabs.forEach((t,i)=>t.onclick=()=>show(i));
document.getElementById('zin').onclick=()=>zoom(1.25);document.getElementById('zout').onclick=()=>zoom(0.8);
document.getElementById('fit').onclick=()=>fit(cur);
zv.onclick=()=>{const v=st[cur];zoom(1/v.k);};
const legend=document.getElementById('legend'),lb=document.getElementById('legbtn');
function togLeg(on){on=on??legend.hidden;legend.hidden=!on;lb.setAttribute('aria-expanded',on);lb.textContent=on?'Скрыть легенду':'Легенда';}
lb.onclick=()=>togLeg();document.getElementById('legclose').onclick=()=>togLeg(false);
pages.forEach((p,i)=>{
 let drag=null,moved=false;
 p.addEventListener('wheel',e=>{e.preventDefault();const r=p.getBoundingClientRect();zoom(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
 p.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,ox:st[i].x,oy:st[i].y,id:e.pointerId};moved=false;});
 p.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)>4){moved=true;p.classList.add('drag');p.setPointerCapture(drag.id);}if(moved){st[i].x=drag.ox+dx;st[i].y=drag.oy+dy;apply(i);}});
 const end=()=>{drag=null;p.classList.remove('drag');};p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);
 p.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
 p.querySelectorAll('a.lnk').forEach(a=>{a.addEventListener('mouseenter',()=>{url.textContent=a.getAttribute('href');url.style.opacity=1;});a.addEventListener('mouseleave',()=>url.style.opacity=0);});
});
document.querySelectorAll('.legsvg a').forEach(a=>a.removeAttribute('href'));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key>='1'&&e.key<='4')show(+e.key-1);else if(e.key==='+'||e.key==='=')zoom(1.25);else if(e.key==='-')zoom(0.8);else if(e.key==='0')fit(cur);else if(e.key==='l'||e.key==='L'||e.key==='д'||e.key==='Д')togLeg();else if(e.key==='Escape')togLeg(false);});
addEventListener('resize',()=>fit(cur));
const h=parseInt(location.hash.slice(1));show(h>=1&&h<=4?h-1:0);
})();
</script></body></html>
